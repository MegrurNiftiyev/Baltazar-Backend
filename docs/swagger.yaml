# ──────────────────────────────────────────────────────────────────────────
# Baltazar API — OpenAPI 3.0 Specification (Static Reference)
#
# NOTE: The canonical spec is auto-generated at runtime by swagger-jsdoc
# from @swagger JSDoc annotations in each *.routes.ts file.
# This file serves as a static reference / export snapshot.
#
# To regenerate:
#   1. Start the dev server: npm run dev
#   2. Visit http://localhost:3000/api-docs — interactive Swagger UI
#   3. GET  http://localhost:3000/api-docs.json — raw JSON spec
# ──────────────────────────────────────────────────────────────────────────

openapi: "3.0.0"
info:
  title: Baltazar API
  version: 1.0.0
  description: >
    Multi-domain consumer API — rent-a-car, travel, hotel, food,
    booking flow (FlowBox), payments, reviews, wishlists.

servers:
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request body

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, token refresh, Google OAuth
  - name: Users
    description: User profile operations
  - name: Admin
    description: Admin-only management endpoints
  - name: Services
    description: Top-level service catalogue
  - name: RentACar
    description: Car rental companies and vehicles
  - name: Travel
    description: Travel companies, tours, and included services
  - name: Hotel
    description: Hotels and room listings
  - name: Food
    description: Food companies and menu items
  - name: FlowBox
    description: Multi-step booking flow management
  - name: Payment
    description: Payment methods and charges
  - name: Reviews
    description: User reviews and ratings
  - name: Wishlist
    description: User wishlist management

paths:
  # ── Auth ────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                phone: { type: string }
                region: { type: string }
                language: { type: string, enum: [az, en, ru] }
      responses:
        "201": { description: User registered successfully }
        "409": { description: User with this email already exists }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Login successful }
        "401": { description: Invalid email or password }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: Tokens refreshed }
        "401": { description: Invalid or expired refresh token }

  /api/auth/google:
    post:
      tags: [Auth]
      summary: Login/register with Google OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        "200": { description: Login successful }
        "401": { description: Invalid Google token }

  # ── Users ───────────────────────────────────────────────────────────────
  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        "200": { description: User profile }
        "401": { description: Unauthorized }
    put:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                region: { type: string }
                language: { type: string, enum: [az, en, ru] }
      responses:
        "200": { description: Profile updated }
        "401": { description: Unauthorized }

  # ── Admin ───────────────────────────────────────────────────────────────
  /api/admin/users/add-admin:
    post:
      tags: [Admin]
      summary: Promote a user to admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200": { description: User promoted }
        "403": { description: Forbidden }

  /api/admin/flowboxes:
    get:
      tags: [Admin]
      summary: List all flowboxes (admin)
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200": { description: Flowbox list }

  /api/admin/flowboxes/{id}:
    get:
      tags: [Admin]
      summary: Get flowbox by ID (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Flowbox details }

  /api/admin/flowboxes/{id}/status:
    put:
      tags: [Admin]
      summary: Update flowbox status (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        "200": { description: Status updated }

  /api/admin/transactions:
    get:
      tags: [Admin]
      summary: List all transactions (admin)
      responses:
        "200": { description: Transaction list }

  /api/admin/reviews:
    get:
      tags: [Admin]
      summary: List all reviews (admin)
      responses:
        "200": { description: Reviews list }

  /api/admin/reviews/{id}:
    delete:
      tags: [Admin]
      summary: Delete a review (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Review deleted }

  # ── Services ────────────────────────────────────────────────────────────
  /api/servis:
    get:
      tags: [Services]
      summary: List all services
      security: []
      responses:
        "200": { description: Service list }

  # ── RentACar ────────────────────────────────────────────────────────────
  /api/rentacar/companies:
    get:
      tags: [RentACar]
      summary: List all rental companies
      security: []
      responses:
        "200": { description: Company list }

  /api/rentacar/companies/{id}:
    get:
      tags: [RentACar]
      summary: Get rental company details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Company details }

  /api/rentacar/cars:
    get:
      tags: [RentACar]
      summary: List cars with filters
      security: []
      parameters:
        - in: query
          name: companyId
          schema: { type: string }
        - in: query
          name: brand
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
      responses:
        "200": { description: Car list }

  /api/rentacar/cars/{id}:
    get:
      tags: [RentACar]
      summary: Get car details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Car details }

  # ── Travel ──────────────────────────────────────────────────────────────
  /api/travel/companies:
    get:
      tags: [Travel]
      summary: List travel companies
      security: []
      responses:
        "200": { description: Company list }

  /api/travel/companies/{id}:
    get:
      tags: [Travel]
      summary: Get travel company details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Company details }

  /api/travel/tours:
    get:
      tags: [Travel]
      summary: List tours with filters
      security: []
      parameters:
        - in: query
          name: companyId
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: minRating
          schema: { type: number }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: name
          schema: { type: string }
      responses:
        "200": { description: Tour list }

  /api/travel/tours/{id}:
    get:
      tags: [Travel]
      summary: Get tour details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Tour details }

  /api/included-services/{serviceType}:
    get:
      tags: [Travel]
      summary: Get included services by type
      security: []
      parameters:
        - in: path
          name: serviceType
          required: true
          schema: { type: string }
      responses:
        "200": { description: Included services list }

  # ── Hotel ───────────────────────────────────────────────────────────────
  /api/hotel:
    get:
      tags: [Hotel]
      summary: List hotels with filters
      security: []
      parameters:
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: starRating
          schema: { type: integer }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: minRating
          schema: { type: number }
        - in: query
          name: name
          schema: { type: string }
      responses:
        "200": { description: Hotel list }

  /api/hotel/{id}:
    get:
      tags: [Hotel]
      summary: Get hotel details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Hotel details }

  /api/hotel/{id}/rooms:
    get:
      tags: [Hotel]
      summary: List rooms for a hotel
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: roomType
          schema: { type: string }
      responses:
        "200": { description: Room list }

  # ── Food ────────────────────────────────────────────────────────────────
  /api/food/companies:
    get:
      tags: [Food]
      summary: List food companies
      security: []
      responses:
        "200": { description: Company list }

  /api/food/companies/{id}:
    get:
      tags: [Food]
      summary: Get food company details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Company details }

  /api/food/items:
    get:
      tags: [Food]
      summary: List food items with filters
      security: []
      parameters:
        - in: query
          name: companyId
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: minPrice
          schema: { type: number }
        - in: query
          name: maxPrice
          schema: { type: number }
        - in: query
          name: name
          schema: { type: string }
      responses:
        "200": { description: Food item list }

  /api/food/items/{id}:
    get:
      tags: [Food]
      summary: Get food item details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Food item details }

  # ── FlowBox ─────────────────────────────────────────────────────────────
  /api/flowboxes:
    post:
      tags: [FlowBox]
      summary: Create a new FlowBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, serviceId]
              properties:
                serviceType: { type: string }
                serviceId: { type: string }
      responses:
        "201": { description: FlowBox created }
    get:
      tags: [FlowBox]
      summary: List user's FlowBoxes
      responses:
        "200": { description: FlowBox list }

  /api/flowboxes/{id}:
    get:
      tags: [FlowBox]
      summary: Get FlowBox details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: FlowBox details }

  /api/flowboxes/{id}/step:
    put:
      tags: [FlowBox]
      summary: Advance FlowBox to next step
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screen, data]
              properties:
                screen: { type: string }
                data: { type: object }
      responses:
        "200": { description: Step advanced }

  /api/flowboxes/{id}/cancel:
    put:
      tags: [FlowBox]
      summary: Cancel a FlowBox
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: FlowBox cancelled }

  /api/flowboxes/{id}/payment-summary:
    get:
      tags: [Payment]
      summary: Get payment summary for a FlowBox
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment summary }

  /api/flow-screens/{serviceType}:
    get:
      tags: [FlowBox]
      summary: Get flow screen config (admin)
      parameters:
        - in: path
          name: serviceType
          required: true
          schema: { type: string }
      responses:
        "200": { description: Screen config }
    put:
      tags: [FlowBox]
      summary: Update flow screen config (admin)
      parameters:
        - in: path
          name: serviceType
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200": { description: Config updated }

  # ── Payment ─────────────────────────────────────────────────────────────
  /api/payment/all-cards:
    get:
      tags: [Payment]
      summary: List saved payment methods
      responses:
        "200": { description: Card list }

  /api/payment/add-card:
    post:
      tags: [Payment]
      summary: Add a payment card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber, expMonth, expYear, cvv]
              properties:
                cardNumber: { type: string }
                expMonth: { type: integer }
                expYear: { type: integer }
                cvv: { type: string }
      responses:
        "201": { description: Card added }

  /api/payment/pay:
    post:
      tags: [Payment]
      summary: Process a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowBoxId, paymentMethodId]
              properties:
                flowBoxId: { type: string }
                paymentMethodId: { type: string }
      responses:
        "200": { description: Payment processed }

  # ── Reviews ─────────────────────────────────────────────────────────────
  /api/reviews:
    get:
      tags: [Reviews]
      summary: List reviews
      security: []
      parameters:
        - in: query
          name: targetType
          required: true
          schema: { type: string }
        - in: query
          name: targetId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Review list }
    post:
      tags: [Reviews]
      summary: Create a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, rating]
              properties:
                targetType: { type: string }
                targetId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201": { description: Review created }

  # ── Wishlist ────────────────────────────────────────────────────────────
  /api/user/wishlist:
    get:
      tags: [Wishlist]
      summary: Get user wishlist
      responses:
        "200": { description: Wishlist items }
    post:
      tags: [Wishlist]
      summary: Add item to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, serviceType]
              properties:
                serviceId: { type: string }
                serviceType: { type: string }
      responses:
        "201": { description: Item added }

  /api/user/wishlist/{id}:
    delete:
      tags: [Wishlist]
      summary: Remove item from wishlist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Item removed }
